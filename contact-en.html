<script>
/* E-Mail kopieren: Rückmeldung über Text am Knopf und eine Statuszeile (zwei Merkmale, nicht nur Farbe) */
(function(){
  const btn=document.querySelector('.node-copy'), txt=btn&&btn.querySelector('.copy-txt'), msg=document.querySelector('.map-msg');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    let ok=false;
    try { await navigator.clipboard.writeText(btn.dataset.copy); ok=true; } catch(e) {}
    txt.textContent = ok ? '( copied ✓ )' : '( copy )';
    btn.classList.toggle('done', ok);
    msg.textContent = ok ? 'Email address copied.' : 'Couldn’t copy. Select the address and copy it manually.';
    if (ok && window.Sound) Sound.tick();
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { txt.textContent='( copy )'; btn.classList.remove('done'); msg.textContent=''; }, 2400);
  });
})();

/* Kontakt-Karte
   1. Punkte fliegen zusammen und bilden „HIRE ME“ in der eigenen Pixel-Schrift
   2. Danach wachsen Linien von dort zu den vier Kontaktwegen, die Wege erscheinen nacheinander
   3. Ein oranger Punkt läuft die Linien entlang; beim Überfahren oder Fokussieren eines Wegs läuft er dorthin und bleibt
   Weniger Bewegung gewünscht: alles steht sofort da, kein laufender Punkt */
(function(){
  document.documentElement.classList.add('map-js');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const map=document.querySelector('.map'), svg=map.querySelector('.map-lines'), g=svg.querySelector('.ml-paths'), dotEl=svg.querySelector('.ml-dot');
  const hub=map.querySelector('.hub'), cv=document.getElementById('hireDots'), ctx=cv.getContext('2d');
  const nodes=[...map.querySelectorAll('.node')];
  const css=getComputedStyle(document.body);
  const ink=css.getPropertyValue('--color-portrait').trim()||'#2a2c31';
  const NS='http://www.w3.org/2000/svg';

  /* --- 1 · Punkte „HIRE ME“ --- */
  let W=0,H=0,P=[],mx=-9999,my=-9999,assembled=reduce;
  function buildDots(){
    const dpr=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!window.PixelFont) return;
    const lines=['HIRE','ME'].map(t=>PixelFont.cellsFor(t));
    const maxW=Math.max(...lines.map(l=>l.width));
    const rows=7*2+3, cs=Math.min(W*0.92/maxW,H*0.96/rows), sub=cs/3;
    const pts=[];
    lines.forEach((l,li)=>{
      const x0=(W-l.width*cs)/2, y0=(H-rows*cs)/2+li*10*cs;
      l.cells.forEach(([cx,cy])=>{for(let a=0;a<3;a++)for(let b=0;b<3;b++)pts.push([x0+cx*cs+a*sub+sub/2,y0+cy*cs+b*sub+sub/2]);});
    });
    P=pts.map(([x,y],i)=>{const o=P[i];return{x,y,sz:sub*0.7,cx:o?o.cx:(reduce?x:Math.random()*W),cy:o?o.cy:(reduce?y:Math.random()*H),vx:0,vy:0};});
  }
  function drawDots(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle=ink;
    let err=0;
    for(const p of P){
      if(!reduce){
        const dx=p.cx-mx, dy=p.cy-my, d2=dx*dx+dy*dy, R=46;
        if(d2<R*R){const d=Math.sqrt(d2)||1,k=(1-d/R)*2.2;p.vx+=dx/d*k;p.vy+=dy/d*k;}
        p.vx+=(p.x-p.cx)*0.08; p.vy+=(p.y-p.cy)*0.08; p.vx*=0.78; p.vy*=0.78; p.cx+=p.vx; p.cy+=p.vy;
        err+=Math.abs(p.x-p.cx)+Math.abs(p.y-p.cy);
      }
      ctx.fillRect(p.cx-p.sz/2,p.cy-p.sz/2,p.sz,p.sz);
    }
    if(!assembled && P.length && err/P.length<1.2){assembled=true; startLines();}
  }
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
  cv.addEventListener('pointerleave',()=>{mx=my=-9999;});
  cv.addEventListener('click',()=>{ if(reduce) return; P.forEach(p=>{const a=Math.random()*6.28,s=5+Math.random()*12;p.vx+=Math.cos(a)*s;p.vy+=Math.sin(a)*s;}); if(window.Sound) Sound.pop(); });

  /* --- 2 · Linien --- */
  let paths=[], grown=reduce, t0=0;
  function layoutLines(){
    const m=map.getBoundingClientRect(), h=hub.getBoundingClientRect();
    svg.setAttribute('width',m.width); svg.setAttribute('height',m.height); svg.setAttribute('viewBox',`0 0 ${m.width} ${m.height}`);
    const hx=h.left-m.left, hy=h.top-m.top, hw=h.width, hh=h.height;
    const stacked=getComputedStyle(map).getPropertyValue('--stacked').trim()==='1';
    g.innerHTML=''; paths=[];
    nodes.forEach((n,i)=>{
      const r=n.getBoundingClientRect(), a=n.querySelector('.node-main').getBoundingClientRect(), nx=r.left-m.left, ty=new DOMMatrix(getComputedStyle(n).transform).m42, cy=a.top-m.top+a.height/2-ty;   // Versatz vom Einblenden herausrechnen
      let d, x1, y1;
      if(stacked){
        // Handy: Linie vom unteren Rand von HIRE ME am linken Rand entlang zu jedem Weg
        // gemeinsame senkrechte Linie links, von dort ein kurzer Bogen zu jedem Weg
        const sx=hx+hw/2, sy=hy+hh+12, spine=nx-30, top=sy+56; x1=nx-8; y1=cy;
        d=`M${sx},${sy} C${sx},${sy+40} ${spine},${sy+16} ${spine},${top} L${spine},${y1-14} Q${spine},${y1} ${spine+14},${y1} L${x1},${y1}`;
      } else if(n.dataset.side==='l'){
        const sx=hx-10, sy=hy+hh*(i===0?0.36:0.64); x1=r.right-m.left+14; y1=cy;
        const k=(sx-x1)*0.5; d=`M${sx},${sy} C${sx-k},${sy} ${x1+k},${y1} ${x1},${y1}`;
      } else {
        const sx=hx+hw+10, sy=hy+hh*(i===2?0.36:0.64); x1=nx-14; y1=cy;
        const k=(x1-sx)*0.5; d=`M${sx},${sy} C${sx+k},${sy} ${x1-k},${y1} ${x1},${y1}`;
      }
      const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); p.setAttribute('class','ml-path');
      const end=document.createElementNS(NS,'circle'); end.setAttribute('r','3'); end.setAttribute('cx',x1); end.setAttribute('cy',y1); end.setAttribute('class','ml-end');
      g.append(p,end);
      const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=grown?0:len;
      paths.push({p,end,len,n});
    });
    if(grown) nodes.forEach(n=>n.classList.add('in'));
  }
  function startLines(){
    t0=performance.now();
    if(window.Sound) Sound.chime();
  }

  /* --- 3 · laufender oranger Punkt --- */
  let target=-1, run={i:0,t:0}, pinned=-1;
  nodes.forEach((n,i)=>{
    const on=()=>{pinned=i; paths.forEach((q,k)=>q.p.classList.toggle('hot',k===i));};
    const off=()=>{pinned=-1; paths.forEach(q=>q.p.classList.remove('hot'));};
    n.addEventListener('pointerenter',on); n.addEventListener('pointerleave',off);
    n.addEventListener('focusin',on); n.addEventListener('focusout',off);
  });

  let last=0;
  function frame(t){
    drawDots();
    const dt=Math.min(64,t-(last||t)); last=t;
    if(assembled && !grown){
      // Linien wachsen nacheinander, je 700 ms, versetzt um 220 ms
      let done=true;
      paths.forEach((q,i)=>{
        const k=Math.max(0,Math.min(1,(t-t0-i*220)/700)), e=1-Math.pow(1-k,3);
        q.p.style.strokeDashoffset=q.len*(1-e);
        if(k>=1) q.n.classList.add('in'); else done=false;
      });
      if(done){ grown=true; layoutLines(); }
    }
    if(grown && !reduce && paths.length){
      // Punkt läuft vom „HIRE ME“ zum Weg; gepinnt: bleibt am Ende des gewählten Wegs
      if(pinned>=0){ if(run.i!==pinned){run.i=pinned; run.t=0;} run.t=Math.min(1,run.t+dt/700); }
      else { run.t+=dt/1600; if(run.t>1.35){run.t=0; run.i=(run.i+1)%paths.length;} }
      const q=paths[run.i], k=Math.min(1,run.t), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const pt=q.p.getPointAtLength(q.len*e);
      dotEl.setAttribute('cx',pt.x); dotEl.setAttribute('cy',pt.y);
      dotEl.style.opacity = pinned>=0 ? 1 : (run.t>1 ? Math.max(0,1-(run.t-1)/0.3) : 1);
    }
    if(!reduce) requestAnimationFrame(frame);
  }

  function relayout(){ buildDots(); layoutLines(); drawDots(); }   // sofort neu zeichnen, sonst ist die Fläche bis zum nächsten Bild leer
  new ResizeObserver(relayout).observe(map);
  relayout();
  if(reduce){ nodes.forEach(n=>n.classList.add('in')); dotEl.style.opacity=0; }
  else requestAnimationFrame(frame);
})();
</script>
